name: Secret scan

# GitHub's own secret scanning isn't available on these private repos, so
# gitleaks scans every commit reachable from the checkout. Known false
# positives are fingerprinted in .gitleaksignore; a new one ends its line
# with a gitleaks:allow comment.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# On main a newer push supersedes the scan in flight: the scan covers every
# commit reachable from the checkout, and main only moves forward, so the
# newer run also scans the commits of the one it cancels. A PR's scans are
# never cancelled, running or queued: each gets a group of its own, since a
# force-push can drop a commit from the newer checkout, and a secret pushed
# in it must still be reported.
concurrency:
  group: secret-scan-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ${{ vars.CI_RUNNER != '' && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256_X64: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      GITLEAKS_SHA256_ARM64: e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A self-hosted runner (vars.CI_RUNNER) may be arm64; each build is pinned by its own hash.
      - name: Install gitleaks
        run: |
          case "$RUNNER_ARCH" in
            ARM64) arch=arm64; sum="$GITLEAKS_SHA256_ARM64" ;;
            *) arch=x64; sum="$GITLEAKS_SHA256_X64" ;;
          esac
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_${arch}.tar.gz"
          echo "${sum}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      - name: Scan every commit
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner .'
