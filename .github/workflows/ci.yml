name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push supersedes the run in flight, on a PR and on main alike: agents
# often push several times in a row, and merges land back to back, so each
# superseded run would otherwise hold a self-hosted runner for a full suite and
# queue every PR behind it (Nov 2, 2026: PR checks waited 1-2 h behind a main
# run for a commit already superseded). On main the newest run tests every
# merge before it as well. Nothing waits on main's CI (images publish in
# parallel; the release PR is gated on its own CI), and Publish images and
# Release please keep their own groups, which never cancel.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which suites a PR can affect. Skipped jobs count as passing for
  # required checks. Pushes to main run everything.
  changes:
    name: Detect changed areas
    runs-on: ${{ vars.CI_RUNNER != '' && github.actor != 'dependabot[bot]' && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    outputs:
      python: ${{ steps.filter.outputs.python }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Filter by changed paths
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          python=true; ui=true
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only "origin/$BASE_REF"...HEAD)
            # Python suites only skip when every change is inside the web app.
            if ! echo "$files" | grep -qv '^packages/ui/'; then python=false; fi
            # The web app's checks only run when it changed, or when something
            # they read changed: this workflow, and the Python files its
            # parity tests parse (see CLAUDE.md -> UI lint).
            if ! echo "$files" | grep -qE '^(packages/ui/|\.github/workflows/ci\.yml$|packages/core/openexecutive/api/main\.py$|packages/core/openexecutive/utils/deployment\.py$)'; then ui=false; fi
          fi
          echo "python=$python" >> "$GITHUB_OUTPUT"
          echo "ui=$ui" >> "$GITHUB_OUTPUT"

  python-lint:
    name: Python lint & type check
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ${{ vars.CI_RUNNER != '' && github.actor != 'dependabot[bot]' && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      # python-version sets UV_PYTHON, so uv uses the 3.11 above. Without it,
      # uv prefers a Python it manages itself: on a self-hosted runner
      # (vars.CI_RUNNER) that can be a newer one, which installs different
      # dependencies (rapidocr-onnxruntime is for < 3.13) and fails tests.
      #
      # GitHub's cache only on GitHub's runners. On the self-hosted ones
      # restoring and saving it took 7-16 min of every job (Nov 2, 2026), while
      # uv's own cache in the runner user's home survives between jobs: the
      # next step points uv at it. uv locks its cache, so the runners sharing
      # the host can use one cache at once. Pull requests and main keep
      # separate caches: uv trusts what it finds in its cache without hashing
      # it again, so a PR's job must not fill the cache main's jobs install
      # from. (Every job runs as the same user on these hosts, so this guards
      # against accidents, not a hostile branch; no job here has secrets, and
      # images are built on GitHub's runners with a fresh cache.)
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: ${{ runner.environment == 'github-hosted' }}
          prune-cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-glob: packages/core/uv.lock
          python-version: "3.11"

      - name: Keep uv's cache on the runner
        if: runner.environment == 'self-hosted'
        run: |
          echo "UV_CACHE_DIR=$HOME/.cache/uv-ci/$TRUST" >> "$GITHUB_ENV"
          echo "MYPY_CACHE_DIR=$HOME/.cache/mypy-ci/$TRUST/$RUNNER_NAME" >> "$GITHUB_ENV"
        env:
          TRUST: ${{ github.event_name == 'push' && 'main' || 'pr' }}

      # docker/Dockerfile installs from uv.lock with `uv sync --locked`, which
      # fails the image build if the lock is stale. `uv sync` below would
      # silently refresh a stale lock in this checkout, so check it first.
      - name: Check uv.lock is current
        run: cd packages/core && uv lock --check

      - name: Install dependencies
        run: cd packages/core && uv sync --extra dev

      - name: Run ruff
        run: cd packages/core && uv run ruff check openexecutive/

      - name: Run mypy
        run: cd packages/core && uv run mypy openexecutive/ --ignore-missing-imports

  pr-checks:
    name: PR rules (arch docs, stubs, evals)
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.CI_RUNNER != '' && github.actor != 'dependabot[bot]' && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      # Rules from CLAUDE.md ("Architecture Docs", "PR Requirements"). The PR
      # body is read for an "Arch-Docs: n/a - <reason>" waiver; it goes in via
      # env, never interpolated into the script.
      - name: Check PR rules
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: python scripts/pr_checks.py --base "origin/$BASE_REF"

  python-test:
    name: Python tests
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ${{ vars.CI_RUNNER != '' && github.actor != 'dependabot[bot]' && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      # python-version sets UV_PYTHON, so uv uses the 3.11 above. Without it,
      # uv prefers a Python it manages itself: on a self-hosted runner
      # (vars.CI_RUNNER) that can be a newer one, which installs different
      # dependencies (rapidocr-onnxruntime is for < 3.13) and fails tests.
      # GitHub's cache only on GitHub's runners; see the lint job.
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: ${{ runner.environment == 'github-hosted' }}
          prune-cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-glob: packages/core/uv.lock
          python-version: "3.11"

      - name: Keep uv's cache on the runner
        if: runner.environment == 'self-hosted'
        run: echo "UV_CACHE_DIR=$HOME/.cache/uv-ci/$TRUST" >> "$GITHUB_ENV"
        env:
          TRUST: ${{ github.event_name == 'push' && 'main' || 'pr' }}

      - name: Install dependencies
        run: cd packages/core && uv sync --extra dev

      # pytest-xdist: one worker per core (4 on ubuntu-latest). `loadfile` keeps
      # each test module on a single worker, so module-level state behaves as in
      # a serial run.
      #
      # TMPDIR on tmpfs: most tests build a fresh SQLite file under tmp_path,
      # and every CREATE/ALTER commits with a disk sync. In RAM those syncs are
      # free, which more than halves the run; each test still gets its own file.
      # Each run gets its own pytest base dir: by default it is
      # $TMPDIR/pytest-of-<user>/pytest-N, which every job of the same user
      # shares. Two self-hosted runners on one machine (one user) then reuse and
      # rotate each other's numbered dirs mid-run, and tests keyed on a temp
      # path's mtime fail at random. Removed afterwards: /dev/shm is RAM.
      - name: Run unit tests
        env:
          TMPDIR: /dev/shm
        run: |
          base="$TMPDIR/oe-pytest-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-unit"
          cd packages/core && status=0
          uv run pytest tests/unit/ -n auto --dist loadfile --tb=short --basetemp="$base" || status=$?
          rm -rf "$base"
          exit "$status"

      # Route-level tests against a temp SQLite DB, with the model calls
      # stubbed; no API key needed. Left out of CI, one rotted unnoticed.
      - name: Run integration tests
        env:
          TMPDIR: /dev/shm
        run: |
          base="$TMPDIR/oe-pytest-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-integration"
          cd packages/core && status=0
          uv run pytest tests/integration/ -n auto --dist loadfile --tb=short --basetemp="$base" || status=$?
          rm -rf "$base"
          exit "$status"

  ui-typecheck:
    name: UI type check
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ${{ vars.CI_RUNNER != '' && github.actor != 'dependabot[bot]' && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/ui/package-lock.json

      - name: Install dependencies
        run: cd packages/ui && npm ci

      - name: Type check
        run: cd packages/ui && npx tsc --noEmit

      # `next lint` no longer exists in Next 16; this is the package-wide
      # eslint run (packages/ui/eslint.config.mjs) that replaced it.
      - name: Lint
        run: cd packages/ui && npm run lint

      # node:test suites added in #100. Runs on the same Node 22 the job
      # already uses (--experimental-strip-types needs 22.6+).
      - name: Run UI unit tests
        run: cd packages/ui && npm test

      - name: Build
        run: cd packages/ui && npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
