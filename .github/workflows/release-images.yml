# Publish the API and UI container images to GitHub Container Registry, and
# on a version tag also create the GitHub Release.
#
# Every push to main refreshes the rolling `main` tag; pushing a `vX.Y.Z` git
# tag (e.g. `git tag v0.2.0 && git push origin v0.2.0`) publishes the versioned
# `X.Y.Z`, `X.Y` and `latest` tags. Both images are built from the Dockerfiles
# under docker/ with the repo root as context. Note that `make docker` builds
# only the API image (compose runs the UI as a dev server), so this workflow
# is the only thing that builds docker/Dockerfile.ui.
#
# Publishing is not gated on ci.yml: the `main` tag is published in parallel
# with CI, and a tag publishes whatever commit it points at. Tag only commits
# on main that CI has passed. The two images are separate matrix jobs, so a
# release is not atomic — if one job fails, the other's tags still exist.
#
# The jobs run in SenteLabsAI/OpenExecutive, and in any other copy whose
# repository variable PUBLISH_IMAGES is `true` (Settings → Secrets and
# variables → Actions → Variables). A fork without it never publishes. The
# image names follow the repository's owner, ghcr.io/<owner>/openexecutive-api
# and -ui, so upstream keeps ghcr.io/sentelabsai/* and a private copy gets its
# own packages, private like the repository it is published from.
#
# Each run's summary lists every pushed tag with the image's digest, which is
# what a server pins (`image: ghcr.io/<owner>/openexecutive-api@sha256:…`).
# The `sha-<short commit>` tag names the commit; for one from an older run:
#   docker buildx imagetools inspect ghcr.io/<owner>/openexecutive-api:sha-<short>
#
# The API image also holds the release's embed outputs (embed-manifest.json,
# host-list.json, openapi.json) at /opt/embed-outputs; see docker/Dockerfile.
#
# A pull request that changes the images' inputs builds both without pushing,
# so a broken Dockerfile shows there and not on main.
#
# Version tags normally come from merging the release PR that
# release-please.yml maintains; that also creates the GitHub Release. For a
# tag pushed by hand, a `vX.Y.Z` tag also creates the GitHub Release once both
# images are published, using that version's CHANGELOG.md section as the
# notes, so the changelog entry must be merged before the commit is tagged. A tag alone
# never shows under Releases. If the images fail, no release is created; if a
# release for the tag already exists (made by hand), the job leaves it alone.
#
# linux/amd64 only. The API image bakes torch plus two embedding-model caches
# (see docker/Dockerfile); building that under arm64 emulation is impractically
# slow. Multi-arch is a follow-up.
name: Publish images

# No workflow_dispatch: `type=ref,event=branch` below would publish a tag
# named after whatever branch it was dispatched from. Re-run a failed run from
# the Actions UI instead.
on:
  pull_request:
    paths:
      - docker/**
      - .dockerignore
      - .github/workflows/release-images.yml
      - scripts/export-openapi.py
      - packages/ui/scripts/embed-outputs.mjs
  push:
    branches: [main]
    # Semver only. A bare `v*` would accept `v0.2` or `vnext`, which
    # metadata-action's semver rules ignore, giving a green run that
    # published no release tags. In these patterns `*` is any run of
    # characters and `+` means one-or-more of the preceding class, so
    # `[0-9]+` is what pins each component to digits.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read
  packages: write

# Keyed on the ref so consecutive pushes to main run in order and a slow
# older build cannot overwrite the `main` tag after a faster newer one.
# (`git push origin main v0.2.0` starts a branch run and a tag run for the
# same commit in different groups; both write `sha-<short>` from the same
# source, which is harmless.) Never cancel a half-pushed release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.name }}
    if: github.repository == 'SenteLabsAI/OpenExecutive' || vars.PUBLISH_IMAGES == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: docker/Dockerfile
          - name: ui
            dockerfile: docker/Dockerfile.ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # ghcr.io/<owner>/openexecutive-<name>; registry names are lowercase.
      - id: image
        env:
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ matrix.name }}
        run: echo "name=ghcr.io/${OWNER,,}/openexecutive-${NAME}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag set:
      #   v1.2.3 tag  -> 1.2.3, 1.2, latest, sha-<short>
      #   main push   -> main, sha-<short>
      # `latest` follows semver tags only (metadata-action's default
      # latest=auto), never a branch push. No bare `{{major}}` tag while the
      # project is pre-1.0 — a `0` tag would be misleading.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha

      # Layer cache lives in the registry under a `buildcache` tag, not the
      # Actions cache: the API image's dependency layers (torch, two baked
      # embedding models, a second venv) still run to well over a GB even on
      # the CPU-only torch build, and the Actions cache is 10 GB per
      # repository shared across everything, so a `type=gha,mode=max` export
      # would churn it and evict the UI's cache.
      # provenance=false keeps each tag a plain single-platform image; the
      # default attestation manifest shows up as an `unknown/unknown` row on
      # the package page.
      # A pull request only builds (no push, no cache write).
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:buildcache,mode=max', steps.image.outputs.name) || '' }}

      # The digest a server pins, with every tag that now points at it.
      - name: Digest to pin
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### ${IMAGE##*/}"
            echo
            echo "Pin: \`${IMAGE}@${DIGEST}\`"
            echo
            echo "Commit \`${GITHUB_SHA}\`, tags:"
            echo
            printf '%s\n' "$TAGS" | sed 's/^/- `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: GitHub Release
    needs: publish
    if: (github.repository == 'SenteLabsAI/OpenExecutive' || vars.PUBLISH_IMAGES == 'true') && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The notes are the tag's `## [X.Y.Z]` section of CHANGELOG.md, up to
      # the next heading or the link references at the bottom. A tag with no
      # changelog section fails here rather than publishing an empty release.
      - name: Create release from the changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it as is."
            exit 0
          fi
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md | sed '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no [$version] section"
            exit 1
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md
