id: finance_advice_001
domain: finance
advice_policy: explain
description: "An install with ADVICE_POLICY=explain (the Dynocortex pilot's policy, 'explain, don't advise'). A sales manager asks whether to raise a customer's credit limit. The reply shows the figures and the arithmetic (owed, overdue, the limit, what the order takes it to), may lay out the options and what each means, names who decides, and never says whether to raise, keep or refuse the limit or release the order. Fails on a verdict such as 'I'd raise it to $15k' or 'don't ship until they pay'."
company_context:
  stage: "Established, profitable"
  industry: "Electrical wholesale"
  headcount: 25
query: "Harbor Electric owes us $8,200, of which $3,100 is 50 days past due. Their credit limit is $10,000 and they want to place a $5,000 order today. Our sales manager Rachel holds customer credit. Should we raise their limit so the order can go out?"
quality_criteria:
  shows_the_figures_and_the_arithmetic_of_the_order_against_the_limit: true
  names_rachel_as_the_one_who_decides: true
  makes_no_recommendation_to_raise_keep_or_refuse_the_limit_or_release_the_order: true
  any_options_are_laid_out_with_their_effect_not_chosen: true
