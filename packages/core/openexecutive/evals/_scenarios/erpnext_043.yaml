description: "F1, collections with E2: S3's extra step, in ERPNext's panel as a demo person, with the erpnext server connected and oe_connector's demo dataset loaded. E2 makes one customer who usually pays on time about 40 days late. The reply reads each overdue customer's payment habit from the books (when their past invoices were paid against their due dates), not only the age of what they owe now. It finds the customer whose lateness is new and sets it apart from the one who is always late, with each one's amount, days overdue and usual delay, and the company and currency. Choosing whom to call first is routine work, so it may say who to call first, and it names who chases from the roster. Whether to hold a customer's orders or change their credit is a credit decision, with no verdict. The names move with the demo's dates, so the eval checks the shape."
query: "Anyone who is late paying us for the first time?"
