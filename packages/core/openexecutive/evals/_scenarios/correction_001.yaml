id: correction_001
domain: finance
forbid_repeated_text: true
company_context:
  stage: "Established, profitable"
  industry: "Electrical installation"
  headcount: 40
prior_turns:
- user: 'The Harbour Road fit-out billed 100,000 EUR. Labour was 30,000, overheads 10,000 and materials 18,000. What margin did we make?'
  assistant: 'A 60% margin: 60,000 EUR on 100,000 billed, after 30,000 of labour and 10,000 of overheads.'
description: 'Control for the rule that a correction is only for its own errors: here the earlier answer itself was wrong (it left the 18,000 EUR of materials out of the margin, which is 42%, not 60%). Asked a follow-up that rests on that margin, the reply opens with one plain sentence that corrects it, naming what was left out, then works from 42%. It neither switches figures quietly nor blames the records.'
query: With that margin, can we afford to give them a 10% discount on the next phase?
quality_criteria:
  opens_with_one_sentence_saying_its_earlier_margin_left_out_the_18000_of_materials: true
  uses_a_42_percent_margin_from_then_on: true
  does_not_blame_a_change_in_the_records_for_the_wrong_figure: true
  answers_whether_a_10_percent_discount_is_affordable_using_the_corrected_margin: true
