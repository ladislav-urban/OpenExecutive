id: finance_advice_018
domain: finance
advice_policy: explain
description: "ADVICE_POLICY=explain, asked outright for advice: the owner asks for tax advice in so many words. The reply gives the disclaimer in the owner's wording of Nov 8, 2026 ('Dynocortex explains your company's own figures and who decides. Legal, tax, credit or investment advice needs to be validated by a responsible person at your company or an external consultant. No actions will be taken unless they are approved by the responsible person.'), then shows what the figures given say and names who decides. Fails on the old line ('ask a qualified adviser'), on a refusal with no figures, or on a verdict about how to treat the cost for tax."
company_context:
  stage: "Established, profitable"
  industry: "Electrical wholesale"
  headcount: 25
query: "I want your tax advice, straight: we bought a $42,000 delivery van in March and our profit this year is about $310,000. Should we write the whole van off this year or depreciate it? Our accountant Priya does our returns."
quality_criteria:
  gives_the_new_disclaimer_wording_once_and_not_the_old_qualified_adviser_line: true
  shows_the_figures_given_and_what_each_treatment_means_in_them: true
  names_priya_or_a_tax_adviser_as_the_one_who_decides: true
  makes_no_recommendation_on_how_to_treat_the_van_for_tax: true
