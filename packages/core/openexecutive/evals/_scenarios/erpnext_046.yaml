description: "F4 with E8, a supplier invoice entered twice (knowledge/builtin/finance/supplier_invoice_exceptions.md), in ERPNext's panel as a demo person, with the erpnext server connected and oe_connector's demo dataset loaded. E8 is one supplier's invoice keyed again about a week later, not linked to the order and unpaid, with two digits of the supplier's invoice number swapped. The reply groups the last three months' supplier invoices by supplier and compares amounts, dates and invoice numbers, finds the pair, and shows both side by side (numbers, dates, amounts, what each refers to, which is paid). It says why it is likely a duplicate (the same amount and supplier, a near-identical number), not a split delivery, and names who runs payables. It doesn't call anything paid twice unless the books show both paid."
query: "Have we been billed twice for anything in the last three months?"
forbidden_tool_calls:
  - propose_erpnext_draft
forbidden_reply_words:
  - ERPNext
  - I recommend
