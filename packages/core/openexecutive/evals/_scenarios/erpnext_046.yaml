  finds_the_pair_with_the_swapped_digits_in_the_invoice_number: true
  shows_both_invoices_side_by_side_with_numbers_dates_amounts_and_paid_status: true
  says_why_it_is_likely_a_duplicate_and_not_a_split_delivery: true
