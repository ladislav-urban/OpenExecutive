  user: How much cash do we have across all our accounts, and what will it look like week by week for the next 13 weeks?
  assistant: 'By the books, cash in the bank and cash accounts covers every week of the next 13, from what is due in and out today (no sales still to come). The lowest week is the one where payroll and rent fall together. Metro Transit Works owes the largest share of what customers have due, part of it already overdue.'
description: 'Cash outlook step 2 (oe_connector''s help/try-cash-outlook.md) in ERPNext''s panel as a demo person, beside Accounts Receivable, following step 1. Asked what changes if Metro pays as late as it usually does, the reply moves Metro''s open invoices by its usual delay and shows the weeks that change. Beside the panel it opens Accounts Receivable for Metro alone, filtered the way that report takes a party: party_type Customer with party a list of names. A ''customer'' filter isn''t one of that report''s, so oe_connector refuses it and nothing opens. expected_report_filters checks the Accounts Receivable view ERPNext accepted.'
