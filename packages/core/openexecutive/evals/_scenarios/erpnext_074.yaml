description: "Cash outlook step 1 (oe_connector's help/try-cash-outlook.md) in Conversations, with the erpnext server connected and oe_connector's demo dataset loaded. The reply gives cash on hand and a week-by-week outlook worked out from what is due in and out, and says the weeks ahead are estimates. The view it opens for what is due includes the invoices already overdue (Metro's among them): it never filters to due dates from a later day on. Found in the pilot's Nov 5, 2026 second retake (OpenExecutive ac2b047b): the view was the Sales Invoice list filtered to 'Payment Due Date >= 2026-12-05', hiding every overdue invoice."
