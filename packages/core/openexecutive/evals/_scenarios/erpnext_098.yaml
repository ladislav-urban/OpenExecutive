description: 'The demo''s where-is-my-order walkthrough, step 4, asked in the panel beside Brightline Builders'' installation project (PROJ-0217, Aurora Components (Demo); check the name after a demo reset). The job''s one Delivery Note has four lines, all fully installed by one Installation Note: Circuit breaker 32A 48, Motion sensor 18, Panel wiring 2.5 mm2 (per metre) 300 Meter, Sub-metering panel 1. The reply lists every line with its delivered and installed quantity, and any count of lines it gives matches what it lists. A demo person can''t read the Project itself: the reply says their own access doesn''t include it, never naming ERPNext. Found on the pilot (Nov 17, 2026) and reproduced in 2 of 3 runs: "covers every line" over a table of three, Panel wiring missing, because the answer check read the 2.5 in the item''s name as a figure no result held and left out its row; and every run said "this ERPNext user has no permission", oe_connector''s own words for the refusal.'
query: Was everything we delivered for this job installed?
