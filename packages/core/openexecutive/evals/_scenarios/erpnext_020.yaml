id: erpnext_020
domain: mcp
description: "ERPNext's \"Ask the Dynocortex\" panel docked beside Dynocortex's own Watch list (surface: erpnext_panel, page screen /watchlist). The person asks what they are watching. The panel's turn can't read their watches, so it says in a sentence that it can't see the Watch list from here, suggests Chats for that, never sends them to the Watch list page they already have open (in OpenExecutive or anywhere else), and invents no watch, goal or figure in place of it. It may offer what it can do from ERPNext instead. Short enough for a side panel"
surface: erpnext_panel
page:
  screen: /watchlist
query: "What am I watching?"
quality_criteria:
  says_it_cannot_see_the_watch_list_from_this_panel: true
  suggests_chats_to_see_or_discuss_the_watches: true
  does_not_send_them_to_the_watch_list_page_they_already_have_open: true
  does_not_invent_watches_goals_or_figures: true
  keeps_the_answer_short_enough_for_a_side_panel: true
  does_not_name_internal_tool_names_to_the_user: true
