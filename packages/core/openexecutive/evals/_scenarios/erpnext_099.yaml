    report: Accounts Receivable
  user: How much cash do we have across all our accounts, and what will it look like week by week for the next 13 weeks?
  assistant: 'By the books, cash in the bank and cash accounts covers every week of the next 13, from what is due in and out today (no sales still to come). The lowest week is the one where payroll and rent fall together. Metro Transit Works owes the largest share of what customers have due, part of it already overdue.'
description: 'A single-figure follow-up to the cash outlook (the same first turn as erpnext_094) in ERPNext''s panel as a demo person, under explain. Asked which week is tightest, the reply leads with that week and the cash it ends at, gives the arithmetic for it in one short line and its assumptions in a few words, and stops there: no week-by-week table, no starting cash by account again, no chain of intermediate steps. The panel''s brevity rule (erpnext_panel.BRIEF_RULE) is what keeps explain''s arithmetic and assumptions short there; before it, erpnext_094''s replies under explain ran to 2,300-2,700 characters.'
query: Which week is the tightest, and what does cash end at that week?
