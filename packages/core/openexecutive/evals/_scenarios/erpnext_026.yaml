description: "ERPNext's panel beside a Delivery Note, on an install that names its product (OE_PRODUCT_NAME=Dynocortex). The person asks whether everything delivered for the job was installed. Found on the pilot (Oct 29, 2026): a correct answer ending 'The installed quantities are as recorded in ERPNext.' The panel's own block and its tools name ERPNext throughout; the reply still calls the system Dynocortex or its records 'the ERP', and never names ERPNext or Open Executive."
