id: erpnext_101
domain: mcp
surface: erpnext_panel
requires_mcp: true
demo_viewer: true
forbid_principal_name: true
product_name: Dynocortex
advice_policy: explain
forbid_repeated_text: true
page:
  report: Accounts Receivable
description: 'Cash outlook step 1 (as erpnext_094''s prior turn) in ERPNext''s panel as a demo person, beside Accounts Receivable. A 13-week outlook needs every open receivable and payable by due week. The Accounts Receivable and Accounts Payable detail reports run out of rows over that span and come back truncated, and an outlook built on those partial rows misses invoices. The guide has the turn read them with list_records grouped instead: Sales Invoice and Purchase Invoice each, outstanding_amount != 0 (returns carry a negative outstanding), due_date up to the outlook''s end, grouped by due_date and party_account_currency (outstanding_amount is in the receivable or payable account''s currency, not the invoice''s). The reply buckets what is due in and out by due week, keeps overdue amounts in, never says the receivables were cut short or partial, and never adds amounts in different currencies into one figure.'
query: How much cash do we have across all our accounts, and what will it look like week by week for the next 13 weeks?
forbidden_tool_calls:
- propose_erpnext_draft
forbidden_reply_words:
- ERPNext
- beside the panel
- cut short
quality_criteria:
  buckets_receivables_and_payables_by_due_week_across_all_13_weeks: true
  receivables_are_complete_with_no_note_that_they_were_cut_short_partial_or_only_the_first_rows: true
  includes_amounts_already_overdue: true
  never_adds_amounts_in_different_currencies_into_one_figure_without_a_stated_conversion: true
  says_the_outlook_is_an_estimate_from_the_books_today: true
  keeps_the_answer_short_enough_for_a_side_panel: true
