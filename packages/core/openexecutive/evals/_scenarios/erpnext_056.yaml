description: 'F1 collections step 3 (oe_connector''s help/try-collections.md) in ERPNext''s panel as a demo person, beside Metro Transit Works'' overdue invoices, with the erpnext server connected and oe_connector''s demo dataset loaded. One customer that pays on time has one invoice about 40 days past due and no reminder (E2). The reply reads that customer''s paid invoices against their due dates, puts it first as the one whose lateness is new, and sets it apart from prompt payers a few days late. Found in the website retake on the pilot (Nov 3, 2026, OpenExecutive 8828ff5, one 67-turn panel conversation): Cedar & Pine was listed last, with its record taken ''per our process note'' because the reply ''couldn''t read its full payment record''.'
